spring.application.name=todoapp


# JPA / Hibernate Ayarlari
# update: Tablo yoksa olusturur, varsa sadece degisiklikleri (yeni sutun vb.) ekler.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Hibernate'in isimlendirme stratejisi (snake_case icin)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Secret Key (Base64 encoded)
# jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# S3 Configuration for MinIO
spring.cloud.aws.s3.endpoint=http://localhost:9000
spring.cloud.aws.s3.path-style-access-enabled=true
spring.cloud.aws.region.static=us-east-1


# Vault Konfigürasyonu
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=00000000-0000-0000-0000-000000000000
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.application-name=todoapp

# ConfigData API (Spring Boot 2.4+)
spring.config.import=optional:vault://